name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

      - run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      # The function ships as one committed bundle. The build above rewrites it; a difference
      # means someone changed server code without committing the new bundle.
      - name: The committed API bundle is up to date
        run: git diff --exit-code -- server/bundle

      # Runs the function the way Vercel does: plain node, only the files Vercel would ship,
      # Vercel's own `vercel build` output and routing table. No tsx, Vite or Vitest.
      - name: Vercel function runs under plain node
        run: npm run test:vercel-function
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries
          REQUIRE_VERCEL_BUILD: '1'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7
