<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Front desk check in</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0E}
.x{font-family:Archivo,system-ui,sans-serif;color:#FFFFFF}
.lab{font-stretch:115%;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#A8A8A8}
.h{font-stretch:120%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0}
.big{font-family:Archivo,sans-serif;border-radius:28px;border:2px solid #FFFFFF;background:transparent;color:#FFFFFF;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:10px;padding:32px;text-align:left}
.chip{background:#171717;border:1px solid #2B2B2B;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.num{font-variant-numeric:tabular-nums}
</style>
<div class="x" style="width: 1180px; height: 820px; box-sizing: border-box; background: #0E0E0E; padding: 36px 44px; display: flex; flex-direction: column; gap: 28px">

  <header style="display: flex; align-items: center; gap: 16px">
    <img src="../../../public/brand/exq-stacked-white.svg" alt="Exquisite Barber and Beauty Lounge" style="height: 34px; width: auto">
    <span class="lab num" style="margin-left: auto; color: #E6E6E6">Mon, Oct 26 · 2:14 PM</span>
    <button aria-label="Exit check in" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A3A3A; background: transparent; color: #A8A8A8; font: 700 11px Archivo, sans-serif; font-stretch: 115%; letter-spacing: .14em; text-transform: uppercase; cursor: pointer">Exit</button>
  </header>

  <h1 class="h" style="font-size: 54px; line-height: 1">Who's coming in?</h1>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; flex: 1">
    <button class="big" style="background: #C8102E; border-color: #C8102E">
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2"></path><path d="M19 8v6M16 11h6"></path></svg>
      <span class="h" style="font-size: 46px">Walk in</span>
      <span style="font-size: 18px; color: #FFE3E8">Pick a service and barber, or the first chair free</span>
    </button>
    <button class="big">
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      <span class="h" style="font-size: 46px">I have an appointment</span>
      <span style="font-size: 18px; color: #D9D9D9">Find it by name or the last 4 of your phone</span>
    </button>
  </div>

  <section aria-label="Chairs right now">
    <div class="lab" style="margin-bottom: 12px">Chairs right now</div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
      <div class="chip"><span class="h" style="font-size: 18px">Dontrise</span><span class="num" style="font-size: 15px; color: #FF5470; font-weight: 700">Free about 2:50</span></div>
      <div class="chip"><span class="h" style="font-size: 18px">Lee</span><span class="num" style="font-size: 15px; color: #FF5470; font-weight: 700">Free about 2:30</span></div>
      <div class="chip" style="border-color: #FFFFFF"><span class="h" style="font-size: 18px">Drew</span><span style="font-size: 15px; color: #FFFFFF; font-weight: 700">Free now</span></div>
      <div class="chip"><span class="h" style="font-size: 18px">Nelly Cutz</span><span class="num" style="font-size: 15px; color: #FF5470; font-weight: 700">Free about 3:00</span></div>
      <div class="chip" style="background: #121212"><span class="h" style="font-size: 18px; color: #A8A8A8">Iniya</span><span style="font-size: 15px; color: #A8A8A8">Off today</span></div>
    </div>
  </section>
</div>
</body>
</html>
