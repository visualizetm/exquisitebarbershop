<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barber sign in</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0E}
.x{font-family:Archivo,system-ui,sans-serif;color:#FFFFFF}
.lab{font-stretch:115%;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A8A8A8}
.h{font-stretch:120%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0}
.who{font-family:Archivo,sans-serif;background:#171717;border:1.5px solid #2B2B2B;border-radius:22px;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 10px;cursor:pointer}
.who:hover{border-color:#FFFFFF}
.ini{width:72px;height:72px;border-radius:50%;background:#0E0E0E;border:2px solid #3A3A3A;display:flex;align-items:center;justify-content:center;font-weight:900;font-stretch:120%;font-size:26px}
</style>
<div class="x" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0E; padding: 28px 20px; display: flex; flex-direction: column; gap: 24px">
  <img src="../../../public/brand/exq-stacked-white.svg" alt="Exquisite Barber and Beauty Lounge" style="height: 26px; width: auto; align-self: flex-start">
  <div>
    <div class="lab">Team portal</div>
    <h1 class="h" style="font-size: 38px; line-height: 1; margin-top: 8px">Who's working?</h1>
    <p style="margin: 10px 0 0; color: #A8A8A8; font-size: 15px">Tap your name, then your PIN.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button class="who"><span class="ini" style="border-color: #FF5470">D</span><span class="h" style="font-size: 17px">Dontrise</span><span class="lab" style="font-size: 10px">Chair 01</span></button>
    <button class="who"><span class="ini">L</span><span class="h" style="font-size: 17px">Lee</span><span class="lab" style="font-size: 10px">Chair 02</span></button>
    <button class="who"><span class="ini">D</span><span class="h" style="font-size: 17px">Drew</span><span class="lab" style="font-size: 10px">Chair 03</span></button>
    <button class="who"><span class="ini">N</span><span class="h" style="font-size: 17px">Nelly Cutz</span><span class="lab" style="font-size: 10px">Chair 04</span></button>
    <button class="who" style="grid-column: span 2; flex-direction: row; justify-content: flex-start; padding: 14px 18px"><span class="ini" style="width: 52px; height: 52px; font-size: 20px">I</span><span style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px"><span class="h" style="font-size: 17px">Iniya</span><span class="lab" style="font-size: 10px">Chair 05</span></span></button>
  </div>
  <p class="lab" style="margin: auto 0 0; text-align: center; text-transform: none; letter-spacing: .02em; font-size: 13px">Not you? Ask Dontrise for your setup link.</p>
</div>
</body>
</html>
