<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barber: add booking</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0E}
.x{font-family:Archivo,system-ui,sans-serif;color:#FFFFFF}
.lab{font-stretch:115%;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A8A8A8}
.h{font-stretch:120%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0}
.btn{font-family:Archivo,sans-serif;font-stretch:112%;font-weight:750;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;min-height:56px;padding:0 18px;border:1.5px solid #FFFFFF;background:transparent;color:#FFFFFF;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.red{background:#C8102E;border-color:#C8102E}
.num{font-variant-numeric:tabular-nums}
.svc{font-family:Archivo,sans-serif;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#171717;border:1.5px solid #2B2B2B;border-radius:18px;color:#FFFFFF;padding:16px;min-height:72px;cursor:pointer}
.bar{flex:1;height:4px;border-radius:999px;background:#2B2B2B}
</style>
<div class="x" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0E; display: flex; flex-direction: column">
  <header style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span class="lab">Add booking · Drew</span>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #3A3A3A; background: transparent; color: #FFFFFF; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div role="img" aria-label="Step 1 of 4" style="display: flex; gap: 6px"><span class="bar" style="background: #FF5470"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
    <h1 class="h" style="font-size: 34px; line-height: 1">What are we doing?</h1>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
    <button class="svc" aria-pressed="true" style="border-color: #FF5470; background: #1F1F1F">
      <span style="flex: 1"><strong style="display: block; font-size: 17px">Adult Cut</strong><span class="num" style="font-size: 13px; color: #A8A8A8">45 min</span></span>
      <span class="h num" style="font-size: 22px">$40</span>
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #FF5470; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="3"><path d="M5 12l5 5L20 7"></path></svg></span>
    </button>
    <button class="svc"><span style="flex: 1"><strong style="display: block; font-size: 17px">Adult Cut with Beard</strong><span class="num" style="font-size: 13px; color: #A8A8A8">45 min</span></span><span class="h num" style="font-size: 22px">$45</span></button>
    <button class="svc"><span style="flex: 1"><strong style="display: block; font-size: 17px">Adult Cut with Design</strong><span class="num" style="font-size: 13px; color: #A8A8A8">60 min</span></span><span class="h num" style="font-size: 22px">$50</span></button>
    <button class="svc"><span style="flex: 1"><strong style="display: block; font-size: 17px">Kids Cut</strong><span class="num" style="font-size: 13px; color: #A8A8A8">30 min · 12 and under</span></span><span class="h num" style="font-size: 22px">$25</span></button>
    <button class="svc"><span style="flex: 1"><strong style="display: block; font-size: 17px">Lineup</strong><span class="num" style="font-size: 13px; color: #A8A8A8">20 min</span></span><span class="h num" style="font-size: 22px">$20</span></button>
    <button class="svc"><span style="flex: 1"><strong style="display: block; font-size: 17px">Hot Towel and Steam</strong><span class="num" style="font-size: 13px; color: #A8A8A8">15 min · add on</span></span><span class="h num" style="font-size: 22px">$20</span></button>
  </div>

  <footer style="padding: 14px 20px 22px; border-top: 1px solid #2B2B2B; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span class="lab">1 service · 45 min</span><span class="h num" style="font-size: 24px">$40</span></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button class="btn red">Now (walk-in)</button>
      <button class="btn">Pick a time</button>
    </div>
  </footer>
</div>
</body>
</html>
