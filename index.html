<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Exquisite Barber & Beauty Lounge</title>
    <meta
      name="description"
      content="Barbers and stylists under one roof in Brookhaven, PA. Gifted Hands. Pick your chair and book online in under a minute."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Applies the stored theme before the first paint. Its sha256 is in the CSP (vercel.json). -->
    <!-- prettier-ignore -->
    <script>(function(){try{var t=localStorage.getItem('exq-theme');var r=document.documentElement;if(t==='light'||t==='dark'){r.setAttribute('data-theme',t)}var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',d?'#111111':'#FFFFFF')}}catch(e){}})();</script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Exquisite Barber & Beauty Lounge" />
    <meta property="og:title" content="Exquisite Barber & Beauty Lounge" />
    <meta
      property="og:description"
      content="Barbers and stylists under one roof in Brookhaven, PA. Gifted Hands. Pick your chair and book online in under a minute."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Exquisite Barber & Beauty Lounge. Fresh cuts. Gifted hands."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="exq-noscript">
        <h1>Exquisite Barber &amp; Beauty Lounge</h1>
        <p>
          Online booking needs JavaScript. To book, call the shop at
          <a href="tel:%SHOP_PHONE_TEL%">%SHOP_PHONE%</a> or come by %SHOP_ADDRESS%. Walk-ins
          welcome.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
